<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#02070d">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>FORCE · Admin</title>
<style>
:root{--bg:#02070d;--panel:#081522;--panel2:#0b1b2b;--blue:#078cff;--blue2:#2db6ff;--text:#f4f8fb;--muted:#95a6b7;--line:rgba(255,255,255,.11);--red:#ff5a6a;--green:#35d39a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(110px,calc(90px + env(safe-area-inset-bottom)))}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
header img{height:30px;width:auto}
.top-actions{display:flex;gap:8px;align-items:center}
.chip{height:34px;min-width:42px;padding:0 10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#8798a8;font:800 10px/1 inherit;letter-spacing:.1em;cursor:pointer;border-radius:0}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:16px}
label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#bfe3ff;margin:0 0 7px}
input[type=password],input[type=text]{width:100%;height:48px;padding:0 14px;background:#030b14;border:1px solid var(--line);color:var(--text);font-size:16px;border-radius:0;outline:none}
input:focus{border-color:var(--blue)}
.field{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:50px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:0}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px 0;margin-top:6px}
.msg{font-size:13px;line-height:1.45;margin-top:12px;min-height:1px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.help{font-size:12px;color:var(--muted);line-height:1.55}
.help ol{padding-left:18px;margin:8px 0}
.help code{background:#030b14;padding:1px 5px;color:#cfe8ff}
[hidden]{display:none!important}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head b{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.nav{width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:18px;cursor:pointer}
.nav:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:10px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.08em;padding-bottom:4px}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
.day.empty{visibility:hidden}
.day.past{opacity:.28;cursor:default}
.day.sun{color:#6f8193}
.day.today{border-color:var(--blue2)}
.day.closed{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 16px rgba(7,140,255,.45)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--blue)}
.legend i.t{background:transparent;border:1px solid var(--blue2)}

/* list */
.list-title{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#bfe3ff;margin:4px 0 10px}
.item{border-left:2px solid var(--blue);background:rgba(7,140,255,.07);padding:12px 12px 12px 14px;margin-bottom:10px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-date{font-weight:800;font-size:14px}
.del{border:1px solid rgba(255,90,106,.4);background:transparent;color:var(--red);height:32px;padding:0 10px;font-size:10px;font-weight:800;letter-spacing:.1em;cursor:pointer}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.names input{height:40px;font-size:14px}
.empty-note{color:var(--muted);font-size:13px;padding:6px 0 2px}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:rgba(2,7,13,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.savebar .wrap{display:flex;gap:10px;align-items:center}
.savebar .state{flex:1;font-size:12px;color:var(--muted);line-height:1.35}
.savebar .state.dirty{color:#ffd27a}
.savebar .btn{width:auto;padding:0 26px;flex:0 0 auto}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/force-logo-white.png" alt="FORCE"></a>
    <div class="top-actions">
      <button class="chip" id="lGR">GR</button><button class="chip" id="lEN">EN</button>
      <button class="chip" id="logout" hidden data-t="logout"></button>
    </div>
  </header>

  <!-- LOGIN -->
  <section id="vLogin" hidden>
    <h1 data-t="loginTitle"></h1>
    <p class="sub" data-t="loginSub"></p>
    <form class="card" id="fLogin" autocomplete="on">
      <input type="text" name="username" value="force-admin" autocomplete="username" hidden>
      <div class="field"><label for="pw" data-t="password"></label><input type="password" id="pw" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="bLogin" data-t="enter"></button>
      <div class="msg" id="mLogin"></div>
    </form>
    <button class="link" id="toSetup" data-t="setupLink"></button>
  </section>

  <!-- SETUP (one-time, done by the site admin) -->
  <section id="vSetup" hidden>
    <h1 data-t="setupTitle"></h1>
    <p class="sub" data-t="setupSub"></p>
    <form class="card" id="fSetup">
      <div class="field"><label for="tok">GitHub token</label><input type="password" id="tok" autocomplete="off" placeholder="github_pat_…" required></div>
      <div class="field"><label for="np1" data-t="newPassword"></label><input type="password" id="np1" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="np2" data-t="repeatPassword"></label><input type="password" id="np2" autocomplete="new-password" minlength="8" required></div>
      <button class="btn" type="submit" id="bSetup" data-t="saveSetup"></button>
      <div class="msg" id="mSetup"></div>
    </form>
    <div class="help card" data-t-html="tokenHelp"></div>
    <button class="link" id="toLogin" data-t="back"></button>
  </section>

  <!-- CALENDAR -->
  <section id="vApp" hidden>
    <h1 data-t="appTitle"></h1>
    <p class="sub" data-t="appSub"></p>
    <div class="card">
      <div class="cal-head">
        <button class="nav" id="prev" aria-label="Previous month">‹</button>
        <b id="monthLabel"></b>
        <button class="nav" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i></i><span data-t="legendClosed"></span></span><span><i class="t"></i><span data-t="legendToday"></span></span></div>
    </div>
    <div class="list-title" data-t="upcoming"></div>
    <div id="list"></div>
  </section>
</div>

<div class="savebar" id="saveBar" hidden>
  <div class="wrap">
    <div class="state" id="saveState"></div>
    <button class="btn" id="bSave" data-t="save" disabled></button>
  </div>
</div>

var lang="el";try{lang=localStorage.getItem("force-lang")||"el"}catch(e){}
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"))});
  document.querySelectorAll("[data-t-html]").forEach(function(el){el.innerHTML=t(el.getAttribute("data-t-html"))});
  $("lGR").classList.toggle("active",lang==="el");$("lEN").classList.toggle("active",lang==="en");
  if(!$("vApp").hidden){renderCal();renderList();renderState();}
}
function $(id){return document.getElementById(id)}
$("lGR").onclick=function(){lang="el";try{localStorage.setItem("force-lang",lang)}catch(e){}applyLang()};
$("lEN").onclick=function(){lang="en";try{localStorage.setItem("force-lang",lang)}catch(e){}applyLang()};

/* ---------- helpers ---------- */
function b64ToBytes(b){var s=atob(b.replace(/\s/g,"")),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function bytesToB64(a){var s="";for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
function utf8ToB64(str){return bytesToB64(new TextEncoder().encode(str))}
function b64ToUtf8(b){return new TextDecoder().decode(b64ToBytes(b))}
function show(v){["vLogin","vSetup","vApp"].forEach(function(id){$(id).hidden=id!==v});$("saveBar").hidden=v!=="vApp";$("logout").hidden=v!=="vApp";}
function msg(id,text,kind){var m=$(id);m.textContent=text||"";m.className="msg"+(kind?" "+kind:"")}

/* ---------- crypto: token encrypted with password ---------- */
function deriveKey(pw,salt,iter){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  });
}
function encryptToken(token,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw,salt,ITER).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(token))})
    .then(function(ct){return {v:1,iter:ITER,salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(ct))}});
}
function decryptToken(blob,pw){
  return deriveKey(pw,b64ToBytes(blob.salt),blob.iter||ITER).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(blob.iv)},k,b64ToBytes(blob.data))})
    .then(function(pt){return new TextDecoder().decode(pt)});
}

/* ---------- GitHub API ---------- */
var token=null;
function gh(method,path,body,tok){
  var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(tok||token)h.Authorization="Bearer "+(tok||token);
  if(body)h["Content-Type"]="application/json";
  return fetch(API+"/repos/"+OWNER+"/"+REPO+"/contents/"+path+(method==="GET"?"?ref="+BRANCH+"&t="+Date.now():""),{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store"})
    .then(function(r){return r.text().then(function(txt){var j=null;try{j=txt?JSON.parse(txt):null}catch(e){}return {status:r.status,ok:r.ok,json:j}})});
}
function getFile(path,tok){return gh("GET",path,null,tok).then(function(r){if(r.status===404)return null;if(!r.ok)throw r;return {sha:r.json.sha,text:b64ToUtf8(r.json.content||"")}})}
function putFile(path,text,sha,message,tok){var body={message:message,content:utf8ToB64(text),branch:BRANCH};if(sha)body.sha=sha;return gh("PUT",path,body,tok).then(function(r){if(!r.ok)throw r;return r.json.content.sha})}

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n}
function iso(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function parseIso(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s||"").trim());return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function dIso(d){return iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function addDay(s,n){var d=parseIso(s);d.setUTCDate(d.getUTCDate()+n);return dIso(d)}
function todayIso(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Nicosia",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){var n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate())}}

var days={};      // "YYYY-MM-DD" -> {en,el}
var savedSnapshot="", fileSha=null;
function parseFile(text){
  var out={};
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line||line.charAt(0)==="#")return;
    var p=line.split("|").map(function(x){return x.trim()});
    var r=p[0].split(/\s+(?:to|-|–|—)\s+|\s*(?:–|—)\s*/i);
    var s=parseIso(r[0]),e=r[1]?parseIso(r[1]):s;if(!s||!e)return;
    if(e<s){var x=s;s=e;e=x}
    for(var d=new Date(s);d<=e;d.setUTCDate(d.getUTCDate()+1))out[dIso(d)]={en:p[1]||"",el:p[2]||""};
  });
  return out;
}
function groups(){
  var keys=Object.keys(days).sort(),out=[];
  keys.forEach(function(k){
    var last=out[out.length-1],v=days[k];
    if(last&&addDay(last.end,1)===k&&last.en===v.en&&last.el===v.el){last.end=k;last.keys.push(k)}
    else out.push({start:k,end:k,en:v.en,el:v.el,keys:[k]});
  });
  return out;
}
function buildFile(){
  return FILE_HEADER+groups().map(function(g){
    var line=g.start+(g.end!==g.start?" to "+g.end:"");
    if(g.en||g.el)line+=" | "+g.en.replace(/\|/g,"/")+(g.el?" | "+g.el.replace(/\|/g,"/"):"");
    return line;
  }).join("\n")+"\n";
}
function snapshot(){return JSON.stringify(Object.keys(days).sort().map(function(k){return [k,days[k].en,days[k].el]}))}
function isDirty(){return snapshot()!==savedSnapshot}
function fmtGroup(g){
  var s=parseIso(g.start),e=parseIso(g.end),M=t("monthsG");
  function one(d,y){return d.getUTCDate()+" "+M[d.getUTCMonth()]+(y?" "+d.getUTCFullYear():"")}
  if(g.start===g.end)return one(s,true);
  if(s.getUTCFullYear()===e.getUTCFullYear()&&s.getUTCMonth()===e.getUTCMonth())return s.getUTCDate()+"–"+one(e,true);
  if(s.getUTCFullYear()===e.getUTCFullYear())return one(s,false)+" – "+one(e,true);
  return one(s,true)+" – "+one(e,true);
}

/* ---------- calendar UI ---------- */
var today=todayIso(), viewY=+today.slice(0,4), viewM=+today.slice(5,7);
function renderCal(){
  $("monthLabel").textContent=t("months")[viewM-1]+" "+viewY;
  $("prev").disabled=(viewY*12+viewM)<=(+today.slice(0,4)*12+ +today.slice(5,7));
  var g=$("grid");g.innerHTML="";
  t("dows").forEach(function(d){var el=document.createElement("div");el.className="dow";el.textContent=d;g.appendChild(el)});
  var first=new Date(Date.UTC(viewY,viewM-1,1)),offset=(first.getUTCDay()+6)%7,count=new Date(Date.UTC(viewY,viewM,0)).getUTCDate();
  for(var i=0;i<offset;i++){var e=document.createElement("div");e.className="day empty";g.appendChild(e)}
  for(var d=1;d<=count;d++){
    var k=iso(viewY,viewM,d),b=document.createElement("button");
    b.type="button";b.textContent=d;b.className="day";b.setAttribute("data-date",k);
    if(k<today){b.classList.add("past");b.disabled=true}
    if((offset+d-1)%7===6)b.classList.add("sun");
    if(k===today)b.classList.add("today");
    if(days[k])b.classList.add("closed");
    b.setAttribute("aria-pressed",days[k]?"true":"false");
    b.onclick=onDay;g.appendChild(b);
  }
}
function onDay(ev){
  var k=ev.currentTarget.getAttribute("data-date");
  if(days[k])delete days[k];
  else{var n=days[addDay(k,-1)]||days[addDay(k,1)];days[k]=n?{en:n.en,el:n.el}:{en:"",el:""}}
  renderCal();renderList();renderState();
}
$("prev").onclick=function(){viewM--;if(viewM<1){viewM=12;viewY--}renderCal()};
$("next").onclick=function(){viewM++;if(viewM>12){viewM=1;viewY++}renderCal()};

function renderList(){
  var L=$("list");L.innerHTML="";
  var up=groups().filter(function(g){return g.end>=today});
  if(!up.length){var p=document.createElement("div");p.className="empty-note";p.textContent=t("none");L.appendChild(p);return}
  up.forEach(function(g){
    var it=document.createElement("div");it.className="item";
    it.innerHTML='<div class="item-top"><span class="item-date"></span><button type="button" class="del"></button></div><div class="names"><input type="text" class="n-en"><input type="text" class="n-el"></div>';
    it.querySelector(".item-date").textContent=fmtGroup(g);
    var del=it.querySelector(".del");del.textContent=t("remove");
    del.onclick=function(){g.keys.forEach(function(k){delete days[k]});renderCal();renderList();renderState()};
    var en=it.querySelector(".n-en"),el=it.querySelector(".n-el");
    en.placeholder=t("nameEn");el.placeholder=t("nameEl");en.value=g.en;el.value=g.el;
    en.setAttribute("aria-label",t("nameEn"));el.setAttribute("aria-label",t("nameEl"));
    en.oninput=function(){g.keys.forEach(function(k){days[k].en=en.value.trim()});renderState()};
    el.oninput=function(){g.keys.forEach(function(k){days[k].el=el.value.trim()});renderState()};
    L.appendChild(it);
  });
}
var lastSaveMsg="";
function renderState(){
  var d=isDirty(),s=$("saveState");
  s.className="state"+(d?" dirty":"");
  s.textContent=d?t("dirty"):(lastSaveMsg||t("clean"));
  $("bSave").disabled=!d;
  if(d)lastSaveMsg="";
}
window.addEventListener("beforeunload",function(e){if(!$("vApp").hidden&&isDirty()){e.preventDefault();e.returnValue=t("leave");return t("leave")}});

/* ---------- flows ---------- */
var keyBlob=null;
function loadDates(){
  return getFile(DATES_PATH).then(function(f){
    fileSha=f?f.sha:null;days=f?parseFile(f.text):{};savedSnapshot=snapshot();
    renderCal();renderList();renderState();
  });
}
function startApp(){
  show("vApp");applyLang();
  $("saveState").textContent=t("loading");
  return loadDates().catch(function(r){
    if(r&&(r.status===401||r.status===403)){logout();msg("mLogin",t("sessionErr"),"err");return}
    $("saveState").textContent=t("netErr");
  });
}
function logout(){token=null;try{sessionStorage.removeItem("force-admin-t")}catch(e){}$("pw").value="";show("vLogin");applyLang()}
$("logout").onclick=function(){if(isDirty()&&!confirm(t("leave")))return;logout()};

$("fLogin").onsubmit=function(e){
  e.preventDefault();msg("mLogin","");
  var pw=$("pw").value;if(!pw)return;
  var b=$("bLogin");b.disabled=true;b.innerHTML='<span class="spinner"></span>'+t("loading");
  var p=keyBlob?Promise.resolve(keyBlob):fetch("/"+KEY_PATH+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null});
  p.then(function(blob){
    if(!blob){msg("mLogin",t("noSetup"),"err");return}
    keyBlob=blob;
    return decryptToken(blob,pw).then(function(tok){
      token=tok;try{sessionStorage.setItem("force-admin-t",tok)}catch(e){}
      return startApp();
    },function(){msg("mLogin",t("wrongPw"),"err")});
  }).catch(function(){msg("mLogin",t("netErr"),"err")})
  .then(function(){b.disabled=false;b.textContent=t("enter")});
};

$("bSave").onclick=function(){
  var b=$("bSave");b.disabled=true;b.innerHTML='<span class="spinner"></span>'+t("saving");
  putFile(DATES_PATH,buildFile(),fileSha,"Update closed dates (admin page)").then(function(sha){
    fileSha=sha;savedSnapshot=snapshot();lastSaveMsg=t("saved");renderState();$("saveState").className="state";
  },function(r){
    if(r&&(r.status===409||r.status===422)){return loadDates().then(function(){lastSaveMsg="";$("saveState").textContent=t("conflict");$("saveState").className="state dirty"})}
    if(r&&(r.status===401||r.status===403)){logout();msg("mLogin",t("sessionErr"),"err");return}
    $("saveState").textContent=t("netErr");$("saveState").className="state dirty";
  }).then(function(){b.textContent=t("save");b.disabled=!isDirty()});
};

$("toSetup").onclick=function(){show("vSetup");msg("mSetup","")};
$("toLogin").onclick=function(){show("vLogin")};
$("fSetup").onsubmit=function(e){
  e.preventDefault();msg("mSetup","");
  var tok=$("tok").value.trim(),p1=$("np1").value,p2=$("np2").value;
  if(p1!==p2){msg("mSetup",t("pwMismatch"),"err");return}
  var b=$("bSetup");b.disabled=true;b.innerHTML='<span class="spinner"></span>'+t("loading");
  getFile(KEY_PATH,tok).then(function(existing){
    return encryptToken(tok,p1).then(function(blob){
      return putFile(KEY_PATH,JSON.stringify(blob,null,2)+"\n",existing&&existing.sha,"Update admin access key",tok).then(function(){
        keyBlob=blob;$("tok").value=$("np1").value=$("np2").value="";
        msg("mSetup",t("setupDone"),"ok");setTimeout(function(){show("vLogin");msg("mLogin","")},1600);
      });
    });
  }).catch(function(r){msg("mSetup",(r&&r.status)?t("badToken"):t("netErr"),"err")})
  .then(function(){b.disabled=false;b.textContent=t("saveSetup")});
};

/* ---------- start ---------- */
applyLang();
var saved=null;try{saved=sessionStorage.getItem("force-admin-t")}catch(e){}
if(saved){token=saved;startApp()}else show("vLogin");
applyLang();
})();
</script>
</body>
</html>
